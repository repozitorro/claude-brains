name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # Caches both the Gradle distribution and the (large) IntelliJ Platform
      # SDK that the gradle-intellij-plugin downloads on the first build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: claude-brains-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

  # Checks the built plugin against each platform it claims to support. The
  # plugin sets no untilBuild, so it installs on releases that did not exist
  # when it was built — this is what turns that from a gamble into a check.
  #
  # Its own job, not a step in `build`: it downloads a full IDE per target, so
  # it must not sit between the tests and the artifact everyone else waits for.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Each IDE is hundreds of megabytes and changes only when the target list
      # does, so key the cache on the file that holds it.
      - name: Cache verifier IDEs
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ hashFiles('gradle.properties') }}
          restore-keys: plugin-verifier-

      - name: Verify plugin compatibility
        run: ./gradlew runPluginVerifier --no-daemon

      - name: Upload verifier report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
