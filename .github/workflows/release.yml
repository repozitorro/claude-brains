name: release

# Tag a commit to publish: git tag v0.2.0 && git push origin v0.2.0
#
# Builds the plugin at that version, attaches the zip to a GitHub Release, and
# refreshes updatePlugins.xml on main. WebStorm polls that file (added as a
# custom plugin repository), so an update shows up in the IDE like any other.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: ./gradlew test buildPlugin -PpluginVersion=${{ steps.version.outputs.value }} --no-daemon

      - name: Write updatePlugins.xml
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # Read the compatibility floor back out of the built plugin, so the
          # repository descriptor can never drift from what was actually shipped.
          unzip -p "build/distributions/claude-brains-$VERSION.zip" \
            "claude-brains/lib/instrumented-claude-brains-$VERSION.jar" > /tmp/plugin.jar
          SINCE=$(unzip -p /tmp/plugin.jar META-INF/plugin.xml | grep -oP 'since-build="\K[^"]+')
          test -n "$SINCE"
          cat > updatePlugins.xml <<XML
          <plugins>
            <plugin id="io.github.repozitorro.claudebrains"
                    url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/claude-brains-${VERSION}.zip"
                    version="${VERSION}">
              <name>Claude Brains</name>
              <description>Chat UI for the Claude Code CLI inside JetBrains IDEs.</description>
              <idea-version since-build="${SINCE}"/>
            </plugin>
          </plugins>
          XML
          cat updatePlugins.xml

      # Uses the runner's preinstalled gh rather than a third-party action.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/distributions/claude-brains-*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Commit updated plugin repository descriptor
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updatePlugins.xml
          git diff --staged --quiet || git commit -m "Point plugin repository at ${GITHUB_REF_NAME}"
          git push origin HEAD:main
