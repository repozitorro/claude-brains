<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* highlight.js theme (injected at runtime) */
__HLJS_THEME__

:root {
  --bg: __BG__;
  --fg: __FG__;
  --muted: __MUTED__;
  --user-bg: __USER_BG__;
  --border: __BORDER__;
  --accent: __ACCENT__;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
  font-family: __FONT__, sans-serif; font-size: __FONTSIZE__px; }
#chat { padding: 8px 10px 24px; }
.msg { margin: 10px 0; }
.msg .role { font-size: 10px; font-weight: bold; opacity: .55; margin-bottom: 3px; }
.msg.user .body { background: var(--user-bg); border-radius: 6px; padding: 6px 10px; }
.msg .body { line-height: 1.45; word-wrap: break-word; }
.msg .body > *:first-child { margin-top: 0; }
.msg .body > *:last-child { margin-bottom: 0; }
.msg .body p { margin: 6px 0; }
.msg .body ul, .msg .body ol { margin: 6px 0; padding-left: 22px; }
.msg .body code { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px;
  background: var(--border); padding: 1px 4px; border-radius: 3px; }
.msg .body pre { position: relative; border-radius: 6px; padding: 10px 10px 8px; overflow-x: auto;
  border: 1px solid var(--border); }
.msg .body pre code { background: none; padding: 0; }
.msg .body a { color: var(--accent); cursor: pointer; text-decoration: none; }
.msg .body a:hover { text-decoration: underline; }
.copy-btn { position: absolute; top: 6px; right: 6px; font-size: 10px; padding: 2px 7px;
  background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px;
  cursor: pointer; opacity: 0; transition: opacity .12s; }
.msg .body pre:hover .copy-btn { opacity: .85; }
.copy-btn:hover { opacity: 1 !important; }
</style>
</head>
<body>
<div id="chat"></div>
<script>
__HLJS_JS__
</script>
<script>
(function () {
  var chat = document.getElementById('chat');

  function b64d(s) { return decodeURIComponent(escape(window.atob(s))); }

  function scrollBottom() { window.scrollTo(0, document.body.scrollHeight); }

  // Bridge to Kotlin for diff/revert link clicks. Replaced at runtime.
  window.cbLink = function (payload) { __QUERY_INJECT__ };

  function enhance(body) {
    body.querySelectorAll('pre code').forEach(function (block) {
      try { window.hljs.highlightElement(block); } catch (e) {}
      var pre = block.parentElement;
      if (pre && !pre.querySelector('.copy-btn')) {
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', function () {
          var text = block.innerText;
          navigator.clipboard.writeText(text).then(function () {
            btn.textContent = 'Copied';
            setTimeout(function () { btn.textContent = 'Copy'; }, 1200);
          }).catch(function () {});
        });
        pre.appendChild(btn);
      }
    });
    body.querySelectorAll('a[data-cb]').forEach(function (a) {
      if (a.__cbWired) return;
      a.__cbWired = true;
      a.addEventListener('click', function (e) {
        e.preventDefault();
        window.cbLink(a.getAttribute('data-cb'));
      });
    });
  }

  window.cbClear = function () { chat.innerHTML = ''; };

  window.cbRender = function (index, role, htmlB64, streaming) {
    var id = 'msg-' + index;
    var el = document.getElementById(id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'msg ' + role;
      el.id = id;
      var label = document.createElement('div');
      label.className = 'role';
      label.textContent = role === 'user' ? 'You' : (role === 'system' ? 'Claude Brains' : 'Claude');
      var body = document.createElement('div');
      body.className = 'body';
      el.appendChild(label);
      el.appendChild(body);
      chat.appendChild(el);
    }
    var body = el.querySelector('.body');
    body.innerHTML = b64d(htmlB64);
    if (!streaming) { enhance(body); }
    scrollBottom();
  };
})();
</script>
</body>
</html>
