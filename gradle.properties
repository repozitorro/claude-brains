pluginVersion=0.7.2
kotlin.stdlib.default.dependency=true
org.gradle.jvmargs=-Xmx2g

# Platforms `runPluginVerifier` checks the built plugin against.
#
# IC-2024.1 is the sinceBuild floor and the platform this is compiled against;
# IC-2025.3 is the newest Community release there is — Community does not ship
# 2026.x at all, which is why naming `IC-2026.1` here fails as undownloadable.
# WebStorm carries on past that and is what the plugin is actually used in, so
# it covers the far end — including 2026.2, where the embedded browser moved
# into its own plugin and took the tool window down with it.
#
# Bump against https://jb.gg/intellij-platform-builds-list; a version that is
# not in that feed is rejected rather than ignored.
pluginVerifierIdeVersions=IC-2024.1,IC-2025.3,WS-2026.2.1
